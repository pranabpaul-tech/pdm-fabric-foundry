<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="890" viewBox="0 0 1240 890" role="img" aria-label="Architecture of the predictive-maintenance build. Scripts on the local machine install the Real-Time Manufacturing Jumpstart into a Fabric workspace, add a PdM layer to its Eventhouse, create an Operations Agent, and deploy a hosted agent in a VNet-injected Foundry project that reads the Eventhouse with read-only KQL. Teams, a downtime feed, ML models, Activator and other parts are not built yet.">
      <title>PdM on Fabric and Foundry: architecture</title>
      <desc>Architecture of the predictive-maintenance build. Scripts on the local machine install the Real-Time Manufacturing Jumpstart into a Fabric workspace, add a PdM layer to its Eventhouse, create an Operations Agent, and deploy a hosted agent in a VNet-injected Foundry project that reads the Eventhouse with read-only KQL. Teams, a downtime feed, ML models, Activator and other parts are not built yet.</desc>
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
        <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahp" d="M0 0 L10 5 L0 10 z"/></marker>
        <marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah-key" d="M0 0 L10 5 L0 10 z"/></marker>
      </defs>
<style>
